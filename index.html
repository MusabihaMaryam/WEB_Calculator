
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">



</head>
<body>
  <div class="overlay"></div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div id="calculator" class="calculator light-theme shadow-lg rounded-4 p-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="fw-bold mb-0">Scientific Calculator</h5>
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary">Toggle Theme</button>
      </div>

      <input type="text" id="display" class="form-control text-end mb-3" readonly>

      <div class="scientific-grid mb-2">
        <button class="btn sci-btn sin">sin</button>
        <button class="btn sci-btn cos">cos</button>
        <button class="btn sci-btn tan">tan</button>
        <button class="btn sci-btn log">log</button>
        <button class="btn sci-btn ln">ln</button>
        <button class="btn sci-btn sqrt">√</button>
        <button class="btn sci-btn square">x²</button>
        <button class="btn sci-btn cube">x³</button>
        <button class="btn sci-btn pi">π</button>
        <button class="btn sci-btn e">e</button>
      </div>

      <div class="button-grid">
        <button class="btn btn-light">7</button>
        <button class="btn btn-light">8</button>
        <button class="btn btn-light">9</button>
        <button class="btn btn-warning">/</button>

        <button class="btn btn-light">4</button>
        <button class="btn btn-light">5</button>
        <button class="btn btn-light">6</button>
        <button class="btn btn-warning">*</button>

        <button class="btn btn-light">1</button>
        <button class="btn btn-light">2</button>
        <button class="btn btn-light">3</button>
        <button class="btn btn-warning">-</button>

        <button class="btn btn-light">0</button>
        <button class="btn btn-light">.</button>
        <button id="clear" class="btn btn-danger">C</button>
        <button class="btn btn-warning">+</button>

        <button id="back" class="btn btn-secondary">Back</button>
        <button id="equals" class="btn btn-success w-100 mt-2">=</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
